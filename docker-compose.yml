services:
  postgres:
    image: postgres:16
    container_name: hydra_postgres
    restart: always
    environment:
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydra123
      POSTGRES_DB: hydra_db
    ports:
      - "5432:5432"
    volumes:
      - hydra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra -d hydra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hydra_app
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://hydra:hydra123@postgres:5432/hydra_db?schema=public
      - JWT_SECRET=sua_chave_secreta_aqui_mudar_em_producao
      # Configurações do MQTT
      - MQTT_HOST=tcp://hydra.cloud.shiftr.io
      - MQTT_PORT=1883
      - MQTT_USERNAME=hydra
      - MQTT_PASSWORD=jPNXy3hCee25J820
      - MQTT_TOPIC=Hydra/#
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hydra_postgres_data: